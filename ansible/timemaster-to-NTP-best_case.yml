---
- name: Switch time synchronization from timemaster to chronyd - best case (HPS100 as NTP source)
  hosts: GWsync-nodes
  become: true
  gather_facts: False

  tasks:
    - name: Create symlink for chrony configuration (best case)
      ansible.builtin.file:
        src: /etc/000chrony-configs/best_case-chrony.conf
        dest: /etc/chrony.conf
        state: link
        force: true

    - name: Stop and disable timemaster service
      ansible.builtin.systemd:
        name: timemaster
        state: stopped
        enabled: false

    - name: Generate timestamp
      ansible.builtin.command: date +%Y%m%d-%H%M
      register: chrony_timestamp
      changed_when: false

    - name: Check for chrony log files
      ansible.builtin.stat:
        path: "/var/log/chrony/{{ item }}"
      loop:
        - measurements.log
        - statistics.log
        - tracking.log
      register: chrony_logs
    
    - name: Archive chrony log files
      ansible.builtin.copy:
        src: "/var/log/chrony/{{ item.item }}"
        dest: "/var/log/chrony/archive/PTP/{{ item.item | regex_replace('\\.log$', '') }}-{{ chrony_timestamp.stdout }}.log"
        remote_src: true
        owner: chrony
        group: chrony
        mode: '0644'
      loop: "{{ chrony_logs.results }}"
      when: item.stat.exists

    - name: Start and enable chronyd service
      ansible.builtin.systemd:
        name: chronyd
        state: started
        enabled: true

    - name: Write current test case file
      ansible.builtin.copy:
        dest: /var/lib/misc/current-test-case
        content: "NTP - Best Case\n"
        owner: root
        group: root
        mode: '0644'
