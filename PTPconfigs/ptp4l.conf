
[global]

#
# IEEE 1588 Default Profile (E2E)
#
twoStepFlag             1
network_transport       UDPv4
delay_mechanism         E2E

# Hardware timestamping
time_stamping           hardware

# Use BMCA normally
slaveOnly               1
priority1               128
priority2               128

# Default profile domain
domainNumber            0

# Message intervals
logAnnounceInterval     1
logSyncInterval         0
logMinDelayReqInterval  0

# Timeouts
announceReceiptTimeout  3

# Servo tuning
clock_servo             pi
step_threshold          0.00002
first_step_threshold    0.00002

# Logging
summary_interval        0
verbose                 0

# Security / interoperability
domainNumber            0
uds_address             /var/run/ptp4l

# Interface section
[enp3s0f0]
